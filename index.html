<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crypto Portfolio</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#18233d;--text:#eef3ff;--muted:#9aabc8;--line:#263554;--accent:#74a7ff;--good:#5bd69c;--bad:#ff7d8b;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title h1{font-size:24px;margin:0}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px}.tabs button.active,.btn.primary{background:var(--accent);color:#081226;border-color:transparent;font-weight:700}.btn.danger{border-color:#6b2d39;color:#ffb7c0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:22px;font-weight:800;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.section{margin-top:14px}.section h2{font-size:17px;margin:0 0 10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px;background:var(--panel)}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}th{color:var(--muted);font-weight:600;background:#10182b;position:sticky;top:0}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.toolbar .grow{flex:1}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0d1528;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.field textarea{min-height:76px}.wide{grid-column:span 2}.full{grid-column:1/-1}.progress{height:8px;background:#0d1528;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}.chip{display:inline-block;padding:3px 7px;border-radius:99px;background:var(--panel2);font-size:11px}.row-actions button{padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:#0d1528;color:var(--text)}.notice{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0f1830;color:var(--muted);font-size:13px}.hidden{display:none!important}.price-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.price-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.price-box strong{font-size:15px}.price-box input{width:100%;margin-top:8px;background:#0d1528;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.subtle{font-size:11px;color:var(--muted);margin-top:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.grid,.price-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:12px}.grid,.price-grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.kpi .value{font-size:19px}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div class="title"><h1>Crypto Portfolio</h1><p>交易紀錄為唯一資料來源 · 移動平均成本 · 第一倉 / 第二倉</p></div><button class="btn" id="refreshPrices">更新 Crypto 價格</button></div>
  <div class="tabs" id="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="transactions">交易紀錄</button><button data-tab="plans">投資計畫</button><button data-tab="prices">價格</button><button data-tab="backup">備份 / 設定</button></div>

  <section id="dashboard" class="tab-pane"></section>
  <section id="transactions" class="tab-pane hidden"></section>
  <section id="plans" class="tab-pane hidden"></section>
  <section id="prices" class="tab-pane hidden"></section>
  <section id="backup" class="tab-pane hidden"></section>
</div>
<script>
(()=>{
const KEY='cryptoPortfolioV1';
const assets=['BTC','ETH','BNB','ADA','SOL','ONDO','ZRO','MSTR'];
const exchanges=['幣安','MAX','OKX','Bitfinex','其他'];
const seed={version:1,fxTwdPerUsd:31.6,prices:{BTC:79855.12,ETH:2501.38,BNB:830,ADA:0.83,SOL:205,ONDO:0.98,ZRO:3.7,MSTR:142.8},priceMeta:{},plans:{第一倉:{BTC:25331,ETH:6333,BNB:0,ADA:0,SOL:0,ONDO:0,ZRO:0,MSTR:0},第二倉:{BTC:0,ETH:0,BNB:0,ADA:0,SOL:0,ONDO:0,ZRO:0,MSTR:1900}},strategyRealized:347,transactions:[
{id:1,warehouse:'第二倉',exchange:'幣安',date:'2026-04-24',side:'買入',asset:'BNB',price:638.16,qty:1.567,amount:1000,feeAsset:'',feeQty:0,note:'第二倉BNB'},{id:2,warehouse:'第二倉',exchange:'幣安',date:'2026-04-24',side:'買入',asset:'SOL',price:86.5,qty:2.312,amount:200,feeAsset:'',feeQty:0,note:'第二倉SOL'},{id:3,warehouse:'第二倉',exchange:'幣安',date:'2026-04-24',side:'買入',asset:'ADA',price:.2518,qty:5805.5,amount:1461,feeAsset:'',feeQty:0,note:'第二倉ADA'},{id:4,warehouse:'第一倉',exchange:'幣安',date:'2026-04-26',side:'買入',asset:'ETH',price:2330,qty:.4288,amount:1000,feeAsset:'',feeQty:0,note:'主倉ETH'},{id:5,warehouse:'第二倉',exchange:'幣安',date:'2026-04-26',side:'買入',asset:'ADA',price:.25253058,qty:494.9,amount:125,feeAsset:'',feeQty:0,note:'第二倉ADA補滿前段'},{id:6,warehouse:'第二倉',exchange:'MAX',date:'2026-04-29',side:'買入',asset:'ADA',price:.2479,qty:1256,amount:314,feeAsset:'',feeQty:0,note:'第二倉ADA補滿'},{id:7,warehouse:'第二倉',exchange:'幣安',date:'2026-04-29',side:'買入',asset:'ETH',price:2327.82,qty:.4295,amount:1000,feeAsset:'',feeQty:0,note:'第二倉ETH'},{id:8,warehouse:'第一倉',exchange:'幣安',date:'2026-05-14',side:'買入',asset:'ETH',price:2268.71,qty:.4402593,amount:999.820497,feeAsset:'ETH',feeQty:.0004407,note:'主倉ETH（扣除手續費後實際入帳）'},{id:9,warehouse:'第一倉',exchange:'幣安',date:'2026-05-15',side:'買入',asset:'ETH',price:2216.52,qty:.4545,amount:1007.4,feeAsset:'ETH',feeQty:.0004407,note:''},{id:10,warehouse:'第一倉',exchange:'幣安',date:'2026-05-15',side:'買入',asset:'BTC',price:79115.73,qty:.02527,amount:2000,feeAsset:'',feeQty:0,note:'BTC'},{id:11,warehouse:'第一倉',exchange:'幣安',date:'2026-05-23',side:'買入',asset:'BTC',price:76000,qty:.01052,amount:800,feeAsset:'BTC',feeQty:.00001052,note:''},{id:12,warehouse:'第一倉',exchange:'幣安',date:'2026-05-28',side:'買入',asset:'BTC',price:74000,qty:.01351,amount:1000,feeAsset:'BTC',feeQty:.00001351,note:''},{id:13,warehouse:'第一倉',exchange:'幣安',date:'2026-06-03',side:'買入',asset:'BTC',price:67289.13,qty:.02975,amount:2000,feeAsset:'',feeQty:0,note:''},{id:14,warehouse:'第一倉',exchange:'幣安',date:'2026-06-05',side:'買入',asset:'BTC',price:61800,qty:.02427,amount:1499.886,feeAsset:'BTC',feeQty:.00002427,note:'第一倉BTC'},{id:15,warehouse:'第一倉',exchange:'幣安',date:'2026-06-15',side:'賣出',asset:'BTC',price:66000,qty:.10456,amount:6900.96,feeAsset:'USDT',feeQty:6.90096,costAdjustment:7528.32,reset:true,note:'全部賣出；成本依原紀錄校正'},{id:16,warehouse:'第一倉',exchange:'幣安',date:'2026-08-19',side:'買入',asset:'BTC',price:64332,qty:.01554,amount:1000,feeAsset:'BTC',feeQty:.00001476,note:'第一倉BTC'},{id:17,warehouse:'第二倉',exchange:'幣安',date:'2026-05-23',side:'買入',asset:'ETH',price:2050,qty:.7317,amount:1500,feeAsset:'ETH',feeQty:0,note:''},{id:18,warehouse:'第一倉',exchange:'幣安',date:'2026-05-11',side:'買入',asset:'ETH',price:2327,qty:.4296,amount:999,feeAsset:'ETH',feeQty:0,note:'原第二倉ETH；已更正為第一倉'},{id:19,warehouse:'第一倉',exchange:'幣安',date:'2026-08-24',side:'買入',asset:'ETH',price:2338.94,qty:4.45207992,amount:10413,feeAsset:'',feeQty:0,note:'ETH網格結算保留ETH，併入現貨持倉'},{id:20,warehouse:'第二倉',exchange:'幣安',date:'2026-08-24',side:'買入',asset:'ETH',price:2338.94,qty:5,amount:10747,feeAsset:'',feeQty:0,note:'ETH網格結算保留ETH，併入現貨持倉'},{id:21,warehouse:'第二倉',exchange:'OKX',date:'2026-08-22',side:'買入',asset:'BTC',price:78270.92,qty:.06393562,amount:5004,feeAsset:'BTC',feeQty:.00006394,note:''},{id:22,warehouse:'第一倉',exchange:'幣安',date:'2026-08-22',side:'買入',asset:'BTC',price:76824,qty:.12880449,amount:10000,feeAsset:'',feeQty:0,note:''},{id:23,warehouse:'第一倉',exchange:'幣安',date:'2026-08-30',side:'賣出',asset:'ETH',price:2457,qty:1,amount:2457,feeAsset:'',feeQty:0,note:''},{id:24,warehouse:'第一倉',exchange:'幣安',date:'2026-08-31',side:'買入',asset:'BTC',price:78103,qty:.0192,amount:1500,feeAsset:'',feeQty:0,note:''},{id:25,warehouse:'第一倉',exchange:'幣安',date:'2026-08-31',side:'買入',asset:'BTC',price:77823,qty:.03044,amount:2369,feeAsset:'',feeQty:0,note:''}]};
let state=load();function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.version?v:structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const fmt=(n,d=2)=>Number.isFinite(+n)?(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';const fmtQty=n=>Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:8}):'—';
function calc(){const pos={},history=[];let realized=0;for(const t of [...state.transactions].sort((a,b)=>a.id-b.id)){const key=t.warehouse+'|'+t.asset,p=pos[key]||{warehouse:t.warehouse,asset:t.asset,qty:0,cost:0,realized:0},beforeQty=p.qty,beforeCost=p.cost;let tradeRealized=0,costRemoved=0;if(t.side==='買入'){const netQty=(+t.qty||0)-((t.feeAsset===t.asset)?(+t.feeQty||0):0);p.qty+=netQty;p.cost+=(+t.amount||0)}else if(t.side==='賣出'){const proceeds=(+t.amount||0)-((t.feeAsset==='USDT')?(+t.feeQty||0):0);costRemoved=Number.isFinite(+t.costAdjustment)&&t.costAdjustment!==null?+t.costAdjustment:(beforeQty>0?(+t.qty||0)*(beforeCost/beforeQty):0);tradeRealized=proceeds-costRemoved;realized+=tradeRealized;p.realized+=tradeRealized;if(t.reset){p.qty=0;p.cost=0}else{p.qty=Math.max(0,beforeQty-(+t.qty||0));p.cost=Math.max(0,beforeCost-costRemoved)}}pos[key]=p;history.push({...t,beforeQty,beforeCost,afterQty:p.qty,afterCost:p.cost,tradeRealized,costRemoved})}return{positions:Object.values(pos),history,realized}}
function marketValue(p){return p.qty*(+state.prices[p.asset]||0)}function signed(n){return `${n>=0?'+':''}${fmt(n)} U`}function kpi(label,val,num){return `<div class="card kpi"><div class="label">${label}</div><div class="value ${num>0?'good':num<0?'bad':''}">${val}</div></div>`}function holdingTable(ps,showWh=false){return `<div class="table-wrap"><table><thead><tr>${showWh?'<th>倉位</th>':''}<th>資產</th><th>數量</th><th>成本U</th><th>均價U</th><th>現價U</th><th>市值U</th><th>未實現</th></tr></thead><tbody>${ps.length?ps.map(p=>{const v=marketValue(p),u=v-p.cost;return `<tr>${showWh?`<td>${p.warehouse}</td>`:''}<td>${p.asset}</td><td>${fmtQty(p.qty)}</td><td>${fmt(p.cost)}</td><td>${p.qty?fmt(p.cost/p.qty):'—'}</td><td>${fmt(state.prices[p.asset]||0)}</td><td>${fmt(v)}</td><td class="${u>=0?'good':'bad'}">${signed(u)}</td></tr>`}).join(''):'<tr><td colspan="8" class="muted">尚無持倉</td></tr>'}</tbody></table></div>`}
function renderDashboard(){const c=calc(),active=c.positions.filter(p=>p.qty>1e-12||p.cost>1e-9),mv=active.reduce((s,p)=>s+marketValue(p),0),cost=active.reduce((s,p)=>s+p.cost,0),unreal=mv-cost,totalReal=c.realized+(+state.strategyRealized||0),byWarehouse=['第一倉','第二倉'].map(w=>({w,ps:active.filter(p=>p.warehouse===w)}));document.querySelector('#dashboard').innerHTML=`<div class="grid">${kpi('目前市值',fmt(mv)+' U')}${kpi('持倉成本',fmt(cost)+' U')}${kpi('未實現損益',signed(unreal),unreal)}${kpi('完整已實現損益',signed(totalReal),totalReal)}</div><div class="split section">${byWarehouse.map(x=>`<div class="card"><h2>${x.w}</h2>${holdingTable(x.ps)}</div>`).join('')}</div><div class="section card"><h2>全部持倉</h2>${holdingTable(active,true)}</div>`}
function inputField(name,label,type,val,extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${val}" ${extra}></div>`}function selectField(name,label,opts,val){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o||'—'}</option>`).join('')}</select></div>`}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function txFormHtml(t={}){return `<input type="hidden" name="id" value="${t.id||''}">${selectField('warehouse','倉位',['第一倉','第二倉'],t.warehouse||'第一倉')}${selectField('exchange','交易所',exchanges,t.exchange||'幣安')}${inputField('date','日期','date',t.date||new Date().toISOString().slice(0,10))}${selectField('side','買賣',['買入','賣出'],t.side||'買入')}${selectField('asset','幣種',assets,t.asset||'BTC')}${inputField('price','成交價 U','number',t.price||'','step="any"')}${inputField('qty','數量','number',t.qty||'','step="any"')}${inputField('amount','交易金額 U','number',t.amount||'','step="any"')}${selectField('feeAsset','手續費幣種',['',...assets,'USDT'],t.feeAsset||'')}${inputField('feeQty','手續費數量','number',t.feeQty||0,'step="any"')}${inputField('costAdjustment','賣出成本校正 U','number',t.costAdjustment??'','step="any"')}<div class="field"><label>清倉</label><select name="reset"><option value="false" ${!t.reset?'selected':''}>否</option><option value="true" ${t.reset?'selected':''}>是</option></select></div><div class="field full"><label>備註</label><textarea name="note">${escapeHtml(t.note||'')}</textarea></div><div class="full toolbar"><button class="btn primary" type="submit">${t.id?'儲存修改':'新增交易'}</button><button class="btn" type="button" id="cancelEdit">清空表單</button></div>`}
function historyTable(h){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>倉位</th><th>日期</th><th>買賣</th><th>幣種</th><th>數量</th><th>金額U</th><th>交易前成本</th><th>交易後成本</th><th>本筆已實現</th><th>操作</th></tr></thead><tbody>${[...h].reverse().map(t=>`<tr><td>${t.id}</td><td>${t.warehouse}</td><td>${t.date}</td><td><span class="chip">${t.side}</span></td><td>${t.asset}</td><td>${fmtQty(t.qty)}</td><td>${fmt(t.amount)}</td><td>${fmt(t.beforeCost)}</td><td>${fmt(t.afterCost)}</td><td class="${t.tradeRealized>0?'good':t.tradeRealized<0?'bad':''}">${t.side==='賣出'?signed(t.tradeRealized):'—'}</td><td class="row-actions"><button data-edit="${t.id}">編輯</button> <button data-del="${t.id}">刪除</button></td></tr>`).join('')}</tbody></table></div>`}
function renderTransactions(){const c=calc();document.querySelector('#transactions').innerHTML=`<div class="card"><h2>新增 / 修改交易</h2><form id="txForm" class="form-grid">${txFormHtml()}</form></div><div class="section"><div class="toolbar"><strong>交易紀錄</strong><span class="grow"></span><span class="muted">修改任何舊交易都會從流水號順序重新計算</span></div>${historyTable(c.history)}</div>`;bindTxForm()}
function bindTxForm(){const f=document.querySelector('#txForm');f.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),id=d.id?+d.id:Math.max(0,...state.transactions.map(x=>x.id))+1,obj={id,warehouse:d.warehouse,exchange:d.exchange,date:d.date,side:d.side,asset:d.asset,price:+d.price||0,qty:+d.qty||0,amount:+d.amount||0,feeAsset:d.feeAsset,feeQty:+d.feeQty||0,costAdjustment:d.costAdjustment===''?null:+d.costAdjustment,reset:d.reset==='true',note:d.note||''},i=state.transactions.findIndex(x=>x.id===id);if(i>=0)state.transactions[i]=obj;else state.transactions.push(obj);save();renderAll();switchTab('transactions')});document.querySelector('#cancelEdit').onclick=()=>renderTransactions();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const t=state.transactions.find(x=>x.id===+b.dataset.edit);document.querySelector('#txForm').innerHTML=txFormHtml(t);bindTxForm();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這筆交易？後續成本會全部重算。')){state.transactions=state.transactions.filter(x=>x.id!==+b.dataset.del);save();renderAll();switchTab('transactions')}})}
function renderPlans(){const c=calc();document.querySelector('#plans').innerHTML=['第一倉','第二倉'].map(w=>{const ps=c.positions.filter(p=>p.warehouse===w);return `<div class="card section"><h2>${w}</h2><div class="table-wrap"><table><thead><tr><th>資產</th><th>目標U</th><th>目前成本U</th><th>達成率</th></tr></thead><tbody>${assets.map(a=>{const target=+state.plans[w][a]||0,p=ps.find(x=>x.asset===a),cost=p?.cost||0,r=target?Math.min(100,cost/target*100):0;return `<tr><td>${a}</td><td><input data-plan="${w}|${a}" type="number" step="any" value="${target}" style="width:110px;background:#0d1528;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px"></td><td>${fmt(cost)}</td><td><div class="progress"><i style="width:${r}%"></i></div><span class="subtle">${target?fmt(cost/target*100,1)+'%':'—'}</span></td></tr>`}).join('')}</tbody></table></div></div>`}).join('');document.querySelectorAll('[data-plan]').forEach(i=>i.onchange=()=>{const[w,a]=i.dataset.plan.split('|');state.plans[w][a]=+i.value||0;save();renderAll();switchTab('plans')})}
function renderPrices(){document.querySelector('#prices').innerHTML=`<div class="notice">Crypto 可按右上角自動抓 Binance 現價；MSTR 目前採手動價，避免瀏覽器跨網域報價失敗。所有價格都可直接覆寫。</div><div class="price-grid section">${assets.map(a=>`<div class="price-box"><strong>${a}</strong><input data-price="${a}" type="number" step="any" value="${state.prices[a]??0}"><div class="subtle">${state.priceMeta[a]||'手動 / 初始值'}</div></div>`).join('')}</div>`;document.querySelectorAll('[data-price]').forEach(i=>i.onchange=()=>{state.prices[i.dataset.price]=+i.value||0;state.priceMeta[i.dataset.price]='手動更新 '+new Date().toLocaleString();save();renderAll();switchTab('prices')})}
function renderBackup(){document.querySelector('#backup').innerHTML=`<div class="grid">${kpi('交易筆數',String(state.transactions.length))}${kpi('匯率 TWD/USD',fmt(state.fxTwdPerUsd,2))}${kpi('策略已結算損益',fmt(state.strategyRealized)+' U')}${kpi('資料位置','此瀏覽器')}</div><div class="card section"><h2>資料備份</h2><div class="toolbar"><button class="btn primary" id="exportJson">匯出 JSON</button><label class="btn">匯入 JSON<input id="importJson" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetData">恢復初始資料</button></div><div class="notice">GitHub 只放程式碼，不保存你的交易資料。換瀏覽器或清除網站資料前，先匯出 JSON。</div></div><div class="card section"><h2>其他設定</h2><div class="form-grid">${inputField('fx','TWD / USD','number',state.fxTwdPerUsd,'step="any"')}${inputField('strategy','策略已結算損益 U','number',state.strategyRealized,'step="any"')}</div></div>`;document.querySelector('[name=fx]').onchange=e=>{state.fxTwdPerUsd=+e.target.value||0;save();renderAll();switchTab('backup')};document.querySelector('[name=strategy]').onchange=e=>{state.strategyRealized=+e.target.value||0;save();renderAll();switchTab('backup')};document.querySelector('#exportJson').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crypto-portfolio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.querySelector('#importJson').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj.transactions||!obj.prices)throw new Error();state=obj;save();renderAll();alert('匯入完成')}catch{alert('JSON 格式不正確')}};r.readAsText(f)};document.querySelector('#resetData').onclick=()=>{if(confirm('確定恢復初始資料？目前瀏覽器資料會被覆蓋。')){state=structuredClone(seed);save();renderAll()}}}
async function refreshCryptoPrices(){const pairs=assets.filter(a=>a!=='MSTR'),btn=document.querySelector('#refreshPrices');btn.disabled=true;btn.textContent='更新中…';try{await Promise.all(pairs.map(async a=>{const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${a}USDT`);if(!r.ok)throw new Error(a);const j=await r.json(),p=+j.price;if(p>0){state.prices[a]=p;state.priceMeta[a]='Binance '+new Date().toLocaleString()}}));save();renderAll()}catch(e){alert('部分價格更新失敗，可到「價格」頁手動輸入。')}finally{btn.disabled=false;btn.textContent='更新 Crypto 價格'}}
function renderAll(){renderDashboard();renderTransactions();renderPlans();renderPrices();renderBackup()}function switchTab(name){document.querySelectorAll('.tab-pane').forEach(x=>x.classList.toggle('hidden',x.id!==name));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name))}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelector('#refreshPrices').onclick=refreshCryptoPrices;renderAll();
})();
</script>
</body>
</html>
